<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento de Contas - Wi-Fi</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(45deg, #1a1a1a, #333);
      color: #fff;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      color: #FF6347;
      margin-top: 30px;
      font-size: 48px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .login-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: 100px;
    }

    .login-container input {
      padding: 15px;
      margin: 10px;
      width: 250px;
      border: 2px solid #FF6347;
      border-radius: 8px;
      background-color: #222;
      color: white;
      font-size: 16px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .login-container input:focus {
      outline: none;
      border-color: #FF4500;
      box-shadow: 0 4px 8px rgba(255, 69, 0, 0.6);
    }

    .login-container button {
      padding: 15px 30px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background-color: #FF6347;
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .login-container button:hover {
      background-color: #e13c00;
      transform: scale(1.05);
    }

    .loading-bar {
      width: 100%;
      height: 30px;
      background-color: #444;
      margin-top: 40px;
      border-radius: 5px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
      display: none;
    }

    .loading-bar span {
      display: block;
      width: 0;
      height: 100%;
      background-color: #FF6347;
      border-radius: 5px;
      animation: loading 5s forwards;
    }

    @keyframes loading {
      0% { width: 0; }
      100% { width: 100%; }
    }

    .result-container {
      display: none;
      margin-top: 50px;
      text-align: center;
    }

    .account {
      font-size: 20px;
      margin: 10px;
      padding: 15px;
      background-color: #444;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
      transition: background-color 0.3s ease;
    }

    .account .warning {
      color: #FF6347;
    }

    .account.new {
      color: #00FF00;
      font-weight: bold;
      background-color: #444;
    }

    .account.inactive {
      color: #FFD700;
    }

    .account.recent {
      color: #1E90FF;
    }

    .reset-btn {
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: white;
      font-size: 18px;
      cursor: pointer;
      margin-top: 30px;
      display: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #444;
      transform: scale(1.05);
    }

  </style>
</head>
<body>
  <h1>Rastreamento de Contas Wi-Fi</h1>

  <div class="login-container">
    <h2>Informe a senha do Wi-Fi</h2>
    <input type="password" id="wifi-password" placeholder="Senha Wi-Fi">
    <button onclick="startTracking()">Iniciar Rastreamento</button>
  </div>

  <div class="loading-bar" id="loading-bar">
    <span></span>
  </div>

  <div class="result-container" id="result-container">
    <h2>Contas Conectadas:</h2>
    <p class="account new">@biancacarla70 – ⚠ Nova conta conectada – <span class="warning">atividade suspeita detectada</span></p>
    <p class="account">@cleiribeiros – <span class="warning">atividade suspeita detectada</span></p>
    <p class="account inactive">@analucia3817 – inativo mas vinculado à rede</p>
    <p class="account recent">@nc_santos81 – online recentemente</p>
    <button class="reset-btn" id="reset-btn" onclick="resetSite()">Reiniciar Rastreamento</button>
  </div>

  <script>
    function startTracking() {
      const password = document.getElementById('wifi-password').value;
      if (!password) {
        alert('Por favor, insira a senha do Wi-Fi!');
        return;
      }

      // Iniciar a animação de carregamento
      document.querySelector('.login-container').style.display = 'none';
      document.getElementById('loading-bar').style.display = 'block';
      document.getElementById('result-container').style.display = 'none';

      // Simulação de rastreamento
      setTimeout(function() {
        // Exibir resultados após a animação de carregamento
        document.getElementById('loading-bar').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('reset-btn').style.display = 'block';
      }, 5000); // 5 segundos de rastreamento
    }

    function resetSite() {
      document.getElementById('wifi-password').value = '';
      document.querySelector('.login-container').style.display = 'block';
      document.getElementById('loading-bar').style.display = 'none';
      document.getElementById('result-container').style.display = 'none';
      document.getElementById('reset-btn').style.display = 'none';
    }
  </script>
</body>
</html>
